<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Story - Story App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content {
            flex: 1;
        }

        footer {
            background-color: #f8f9fa;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar Sticky -->
    <nav class="navbar navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a href="index.html" class="btn btn-light">⬅ Kembali</a>
            <span class="navbar-brand mx-auto">Tambah Story</span>
        </div>
    </nav>

    <!-- Form Tambah Story -->
    <div class="container mt-4 content">
        <h1 class="text-center">Tambah Story Baru</h1>

        <form id="storyForm">
            <div class="mb-3">
                <label for="name" class="form-label">Nama:</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Deskripsi:</label>
                <textarea id="description" class="form-control" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label for="photo" class="form-label">Upload Foto:</label>
                <input type="file" id="photo" class="form-control" accept="image/*" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fa-solid fa-upload"></i> Simpan Story
            </button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p class="mb-0">© 2025 Story App. All Rights Reserved.</p>
    </footer>

    <!-- Script untuk Menyimpan Data ke LocalStorage -->
    <script>
        document.getElementById("storyForm").addEventListener("submit",function(event) {
            event.preventDefault();

            // Ambil nilai input
            const name=document.getElementById("name").value;
            const description=document.getElementById("description").value;
            const photoInput=document.getElementById("photo");

            if(!photoInput.files.length) {
                alert("Harap pilih foto!");
                return;
            }

            // Buat URL untuk foto yang diupload
            const reader=new FileReader();
            reader.onload=function(e) {
                const photoUrl=e.target.result;
                const createdAt=new Date().toISOString();

                // Ambil data story dari LocalStorage atau buat array baru
                let stories=JSON.parse(localStorage.getItem("stories"))||[];

                // Tambahkan story baru
                stories.unshift({name,description,photoUrl,createdAt});

                // Simpan kembali ke LocalStorage
                localStorage.setItem("stories",JSON.stringify(stories));

                // Redirect ke dashboard
                window.location.href="index.html";
            };

            reader.readAsDataURL(photoInput.files[0]);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
