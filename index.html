<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Story App</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script defer="defer" src="app.bundle.js"></script></head><body><navbar-component></navbar-component><menu-offcanvas></menu-offcanvas><div class="container mt-4 content"><dashboard-header></dashboard-header><div id="loading-container" class="loading-container"><div class="spinner"></div></div><div class="row" id="story-container"></div></div><footer-component></footer-component><story-modal id="storyModal"></story-modal><script>let storiesCache=[]; // Menyimpan data story agar tidak hilang saat melihat detail

        async function showStoryDetail(id) {
            try {
                const token=localStorage.getItem("token");
                if(!token) {
                    console.error("Token tidak ditemukan! Pastikan pengguna sudah login.");
                    return;
                }

                const response=await axios.get(`https://story-api.dicoding.dev/v1/stories/${id}`,{
                    headers: {Authorization: `Bearer ${token}`}
                });

                if(response.data&&response.data.story) {
                    const story=response.data.story;
                    const modal=document.getElementById("storyModal");
                    modal.title=story.name;
                    modal.image=story.photoUrl;
                    modal.description=story.description;
                    modal.date=story.createdAt;
                    modal.isOpen=true;

                    setTimeout(() => {modal.isOpen=false;},10000);
                }
            } catch(error) {
                console.error("Error fetching story details:",error);
            }
        }

        async function loadStories() {
            const loadingContainer=document.getElementById("loading-container");
            const storyContainer=document.getElementById("story-container");

            loadingContainer.style.display="flex"; // Tampilkan loading saat pertama kali load

            try {
                const token=localStorage.getItem("token");
                if(!token) {
                    console.error("Token tidak ditemukan! Pastikan pengguna sudah login.");
                    return;
                }

                const response=await axios.get("https://story-api.dicoding.dev/v1/stories",{
                    headers: {Authorization: `Bearer ${token}`}
                });

                if(response.data&&response.data.stories) {
                    storiesCache=response.data.stories; // Simpan cache
                    renderStories(storiesCache);
                }
            } catch(error) {
                console.error("Error fetching stories:",error);
            } finally {
                setTimeout(() => {
                    loadingContainer.style.display="none"; // Hilangkan loading setelah fetch selesai
                },1500);
            }
        }


        document.addEventListener("DOMContentLoaded",() => {
            if(storiesCache.length>0) {
                renderStories(storiesCache); // Gunakan cache jika sudah ada
            } else {
                loadStories(); // Jika belum ada, fetch dari API
            }
        });</script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
