<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><script defer="defer" src="../app.bundle.js"></script></head><body class="d-flex align-items-center justify-content-center vh-100 bg-light"><div class="card p-4 shadow-lg" style="width: 25rem;"><h3 class="text-center">Register</h3><form id="registerForm" novalidate><div class="mb-3"><label for="name" class="form-label">Nama Lengkap</label> <input class="form-control" id="name"><div id="nameError" class="text-danger small"></div></div><div class="mb-3"><label for="email" class="form-label">Email</label> <input type="email" class="form-control" id="email"><div id="emailError" class="text-danger small"></div></div><div class="mb-3"><label for="password" class="form-label">Password</label><div class="password-container"><input type="password" id="password" minlength="8"><div class="password-toggle-container" id="togglePassword"><i class="fas fa-eye"></i></div></div><div id="passwordError" class="text-danger small"></div></div><button type="submit" class="btn-register w-100" id="submitButton"><span id="buttonText">Daftar</span><div id="loadingSpinner" class="loading-spinner"></div></button></form><p class="mt-3 text-center">Sudah punya akun? <a href="/auth/login.html" class="login-link">Login</a></p></div><script>// Fitur toggle password visibility
        const togglePassword=document.getElementById("togglePassword");
        const passwordInput=document.getElementById("password");

        togglePassword.addEventListener("click",function() {
            // Toggle tipe input antara "password" dan "text"
            const type=passwordInput.getAttribute("type")==="password"? "text":"password";
            passwordInput.setAttribute("type",type);

            // Ganti ikon mata
            const icon=this.querySelector("i");
            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });</script></body></html>
