<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><style>/* Custom CSS untuk responsif */
        .password-container {
            position: relative;
        }

        .password-toggle-container {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .btn-register {
            position: relative;
        }

        .loading-spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 576px) {
            .card {
                width: 90% !important;
            }
        }</style><script defer="defer" src="../app.bundle.js"></script></head><body class="d-flex align-items-center justify-content-center vh-100 bg-light"><div class="card p-4 shadow-lg" style="width: 100%; max-width: 25rem;"><h3 class="text-center">Register</h3><form id="registerForm" novalidate><div class="mb-3"><label for="name" class="form-label">Nama Lengkap</label> <input class="form-control" id="name" required><div id="nameError" class="text-danger small"></div></div><div class="mb-3"><label for="email" class="form-label">Email</label> <input type="email" class="form-control" id="email" required><div id="emailError" class="text-danger small"></div></div><div class="mb-3"><label for="password" class="form-label">Password</label><div class="password-container"><input type="password" class="form-control" id="password" minlength="8" required><div class="password-toggle-container" id="togglePassword"><i class="fas fa-eye"></i></div></div><div id="passwordError" class="text-danger small"></div></div><button type="submit" class="btn btn-primary w-100 btn-register" id="submitButton"><span id="buttonText">Daftar</span><div id="loadingSpinner" class="loading-spinner"></div></button></form><p class="mt-3 text-center">Sudah punya akun? <a href="/auth/login.html" class="login-link">Login</a></p></div><script>// Fitur toggle password visibility
        const togglePassword=document.getElementById("togglePassword");
        const passwordInput=document.getElementById("password");

        togglePassword.addEventListener("click",function() {
            // Toggle tipe input antara "password" dan "text"
            const type=passwordInput.getAttribute("type")==="password"? "text":"password";
            passwordInput.setAttribute("type",type);

            // Ganti ikon mata
            const icon=this.querySelector("i");
            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });

        // Contoh fungsi untuk menangani submit form
        document.getElementById("registerForm").addEventListener("submit",function(e) {
            e.preventDefault();

            // Ambil nilai input
            const name=document.getElementById("name").value;
            const email=document.getElementById("email").value;
            const password=document.getElementById("password").value;

            // Validasi sederhana
            let isValid=true;

            if(name.trim()==="") {
                document.getElementById("nameError").textContent="Nama lengkap wajib diisi.";
                isValid=false;
            } else {
                document.getElementById("nameError").textContent="";
            }

            if(email.trim()===""||!email.includes("@")) {
                document.getElementById("emailError").textContent="Email tidak valid.";
                isValid=false;
            } else {
                document.getElementById("emailError").textContent="";
            }

            if(password.length<8) {
                document.getElementById("passwordError").textContent="Password minimal 8 karakter.";
                isValid=false;
            } else {
                document.getElementById("passwordError").textContent="";
            }

            if(isValid) {
                // Tampilkan loading spinner
                document.getElementById("loadingSpinner").style.display="inline-block";
                document.getElementById("buttonText").style.visibility="hidden";

                // Simulasi proses registrasi
                setTimeout(() => {
                    // Sembunyikan loading spinner
                    document.getElementById("loadingSpinner").style.display="none";
                    document.getElementById("buttonText").style.visibility="visible";

                    // Contoh pesan sukses
                    alert("Registrasi berhasil!");
                },2000);
            }
        });</script></body></html>
