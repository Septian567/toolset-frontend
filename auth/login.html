<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script><style>/* Custom CSS untuk responsif */
        .password-container {
            position: relative;
        }

        .password-toggle-container {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .btn-login {
            position: relative;
        }

        .loading-spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 576px) {
            .card {
                width: 90% !important;
            }
        }</style><script defer="defer" src="../app.bundle.js"></script></head><body class="d-flex align-items-center justify-content-center vh-100 bg-light"><div class="card p-4 shadow-lg" style="width: 100%; max-width: 25rem;"><h3 class="text-center">Login</h3><form id="loginForm" novalidate><div class="mb-3"><label for="email" class="form-label">Email</label> <input type="email" class="form-control" id="email" required><div class="text-danger small" id="emailError"></div></div><div class="mb-3"><label for="password" class="form-label">Password</label><div class="password-container"><input type="password" class="form-control" id="password" required><div class="password-toggle-container" id="togglePassword"><i class="fas fa-eye"></i></div></div><div class="text-danger small" id="passwordError"></div></div><button type="submit" class="btn btn-primary w-100 btn-login" id="submitButton"><span id="buttonText">Login</span><div id="loadingSpinner" class="loading-spinner"></div></button></form><p class="mt-3 text-center">Belum punya akun? <a href="/auth/register.html" class="register-link">Daftar</a></p></div><script>// Fitur toggle password visibility
        const togglePassword=document.getElementById("togglePassword");
        const passwordInput=document.getElementById("password");

        togglePassword.addEventListener("click",function() {
            // Toggle tipe input antara "password" dan "text"
            const type=passwordInput.getAttribute("type")==="password"? "text":"password";
            passwordInput.setAttribute("type",type);

            // Ganti ikon mata
            const icon=this.querySelector("i");
            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });

        // Contoh fungsi untuk menangani submit form
        document.getElementById("loginForm").addEventListener("submit",function(e) {
            e.preventDefault();

            const email=document.getElementById("email").value;
            const password=document.getElementById("password").value;

            // Tampilkan loading spinner
            document.getElementById("loadingSpinner").style.display="inline-block";
            document.getElementById("buttonText").style.visibility="hidden";

            // Simulasi proses login
            setTimeout(() => {
                // Sembunyikan loading spinner
                document.getElementById("loadingSpinner").style.display="none";
                document.getElementById("buttonText").style.visibility="visible";

                // Contoh validasi sederhana
                if(email==="user@example.com"&&password==="password") {
                    alert("Login berhasil!");
                } else {
                    alert("Email atau password salah!");
                }
            },2000);
        });</script></body></html>
