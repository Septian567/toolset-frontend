<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Story App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <navbar-component></navbar-component>
    <div class="offcanvas offcanvas-start" id="offcanvasMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-group">
                <li class="list-group-item"><a href="index.html">Dashboard</a></li>
                <li class="list-group-item"><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-4 content">
        <h1 class="text-center">Profile</h1>
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-img-container">
                    <img id="profileImage" src="person.jpeg" alt="Foto Profil" class="profile-img">
                </div>
                <div class="edit-btn-container">
                    <button class="icon-btn" id="changeImageBtn" title="Ganti Foto">
                        <i class="fas fa-camera"></i>
                    </button>
                    <button class="icon-btn" data-bs-toggle="modal" data-bs-target="#editProfileModal"
                        title="Edit Profile">
                        <i class="fas fa-edit"></i>
                    </button>
                </div>
            </div>
            <input type="file" id="uploadImage" class="form-control d-none" accept="image/*">
            <profile-description></profile-description>
        </div>
    </div>

    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label">Nama</label>
                    <input type="text" id="editName" class="form-control">
                    <label class="form-label mt-2">Hobi</label>
                    <input type="text" id="editHobby" class="form-control">
                    <label class="form-label mt-2">Pekerjaan</label>
                    <input type="text" id="editJob" class="form-control">
                    <label class="form-label mt-2">Bidang Kerja</label>
                    <input type="text" id="editField" class="form-control">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="saveProfileBtn">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <footer-component></footer-component>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
