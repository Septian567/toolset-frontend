<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Story App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
    <navbar-component></navbar-component>

    <div class="offcanvas offcanvas-start" id="offcanvasMenu">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="list-group">
                <li class="list-group-item"><a href="index.html">Dashboard</a></li>
                <li class="list-group-item"><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-4 content">
        <dashboard-header></dashboard-header>
        <div class="row" id="story-container"></div>
    </div>

    <footer-component></footer-component>
    <story-modal id="storyModal"></story-modal>

    <script>
        function showStoryDetail(title,image,description,date) {
            const modal=document.getElementById("storyModal");
            modal.title=title;
            modal.image=image;
            modal.description=description;
            modal.date=date;
            modal.isOpen=true;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
