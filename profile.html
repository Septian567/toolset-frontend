<!doctype html><html lang="id"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Profile - Story App</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/><script defer="defer" src="app.bundle.js"></script></head><body><navbar-component></navbar-component><menu-offcanvas></menu-offcanvas><div class="content container mt-4"><h1 class="text-center mb-4">Profile</h1><div class="row justify-content-center"><div class="col-md-8 col-lg-6"><div class="card shadow-sm"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-4"><div class="position-relative"><img id="profileImage" src="person.jpeg" alt="Foto Profil" class="rounded-circle" style="width: 100px; height: 100px; object-fit: cover"/> <button class="btn btn-light btn-sm position-absolute bottom-0 end-0" id="changeImageBtn" title="Ganti Foto"><i class="fas fa-camera"></i></button></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editProfileModal" title="Edit Profile"><i class="fas fa-edit"></i> Edit Profile</button></div><input type="file" id="uploadImage" class="form-control d-none" accept="image/*"/><profile-description></profile-description></div></div></div></div></div><div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Edit Profile</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><form id="editProfileForm" class="needs-validation" novalidate><div class="mb-3"><label for="editName" class="form-label">Nama</label> <input id="editName" class="form-control" required/><div class="invalid-feedback">Nama tidak boleh kosong.</div></div><div class="mb-3"><label for="editHobby" class="form-label">Hobi</label> <input id="editHobby" class="form-control"/></div><div class="mb-3"><label for="editJob" class="form-label">Pekerjaan</label> <input id="editJob" class="form-control"/></div><div class="mb-3"><label for="editField" class="form-label">Bidang Kerja</label> <input id="editField" class="form-control"/></div></form></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button> <button type="button" class="btn btn-primary" id="saveProfileBtn">Simpan</button></div></div></div></div><footer-component></footer-component><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></body></html>
