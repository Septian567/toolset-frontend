<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Story App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
    <navbar-component></navbar-component>
    <!-- <offcanvas-menu></offcanvas-menu> -->
    <div class="offcanvas offcanvas-start" id="offcanvasMenu">
        <offcanvas-header></offcanvas-header>
        <div class="offcanvas-body">
            <ul class="list-group">
                <li class="list-group-item"><a href="index.html">Dashboard</a></li>
                <li class="list-group-item"><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </div>

    <div class="container mt-4 content">
        <dashboard-header></dashboard-header>
        <div class="row" id="story-container"></div>
    </div>

    <footer-component></footer-component>
    <story-modal></story-modal>

    <script>
        document.addEventListener("DOMContentLoaded",function() {
            let userStories=JSON.parse(localStorage.getItem("stories"))||[];

            fetch("DATA.json")
                .then((response) => response.json())
                .then((data) => {
                    renderStories([...userStories,...data.listStory]);
                })
                .catch((error) => console.error("Error fetching data:",error));
        });

        function renderStories(stories) {
            const container=document.getElementById("story-container");
            container.innerHTML="";

            stories.forEach((story,index) => {
                const card=document.createElement("div");
                card.className="col-lg-3 col-md-4 col-sm-6 mb-4 story-card";
                card.dataset.index=index;

                card.innerHTML=`
                    <div class="card h-100 shadow-sm">
                        <img src="${story.photoUrl}" class="card-img-top" alt="${story.name}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-primary" style="cursor: pointer;" data-bs-toggle="modal" data-bs-target="#storyModal"
                                onclick="showStoryDetail('${story.name}', '${story.photoUrl}', '${story.description}', '${story.createdAt}')">
                                ${story.name}
                            </h5>
                            <p class="card-text flex-grow-1">${story.description.substring(0,100)}...</p>
                            <small class="text-muted">📅 ${new Date(story.createdAt).toLocaleDateString()}</small>
                            <button class="delete-btn mt-2" data-index="${index}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.querySelectorAll(".delete-btn").forEach((button) => {
                button.addEventListener("click",function() {
                    deleteStory(this.dataset.index);
                });
            });
        }

        function showStoryDetail(title,image,description,date) {
            document.querySelector('story-modal').showModal(title,image,description,date);
        }


        function deleteStory(index) {
            let userStories=JSON.parse(localStorage.getItem("stories"))||[];

            if(index<userStories.length) {
                if(confirm("Apakah Anda yakin ingin menghapus story ini?")) {
                    userStories.splice(index,1);
                    localStorage.setItem("stories",JSON.stringify(userStories));
                    document.querySelector(`.story-card[data-index='${index}']`).remove();
                    document.querySelectorAll(".story-card").forEach((card,newIndex) => {
                        card.dataset.index=newIndex;
                        card.querySelector(".delete-btn").dataset.index=newIndex;
                    });
                }
            } else {
                alert("Story dari data awal tidak bisa dihapus!");
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
